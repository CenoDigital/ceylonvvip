# Regenerates the Playwright visual baselines in the same container CI compares against,
# then commits them to the branch so the change is reviewed in its pull request.
# Trigger: add the label "update-visual-baselines" to a PR, or run it manually on a branch.
name: Update visual baselines

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-visual-baselines'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: ceylonvvip
          POSTGRES_PASSWORD: ceylonvvip
          POSTGRES_DB: ceylonvvip
        options: >-
          --health-cmd "pg_isready -U ceylonvvip -d ceylonvvip"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URI: postgres://ceylonvvip:ceylonvvip@postgres:5432/ceylonvvip
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Local media (no S3 here): one absolute folder for the seed and the server.
      MEDIA_DIR: ${{ github.workspace }}/apps/web/media
      # Same as the CI browser job, so baselines match what CI compares.
      SITE_ENV: production
      UI_GALLERY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR branch itself (not the merge commit), so the new baselines can be pushed to it.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway Payload secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "PAYLOAD_SECRET=$secret" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=web
      - name: Load the Figma content (migrate, then seed)
        working-directory: apps/web
        run: |
          pnpm migrate
          pnpm seed
      - name: Start the production server
        working-directory: apps/web
        run: |
          nohup node scripts/start-standalone.mjs > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - name: Regenerate baselines
        working-directory: apps/web
        run: pnpm exec playwright test visual --update-snapshots=all
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update visual baselines"
            git push
          fi
