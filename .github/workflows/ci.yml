# Checks on every pull request and on main: format, lint, types and unit tests, the
# security scans, and the Docker image with its Trivy scan. Coolify only receives images
# that passed them. The end-to-end, accessibility, visual, Lighthouse and Postgres
# integration tests are run locally before merging (pnpm --filter web test:e2e and
# test:int), not here, to keep CI short.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/cenodigital/ceylonvvip-web

jobs:
  verify:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated Payload types are committed
        env:
          PAYLOAD_SECRET: ci-type-generation-only
          # Storage on, as in every real environment, so its fields are in the types.
          S3_BUCKET: ceylonvvip-media
          DATABASE_URI: postgres://unused:unused@127.0.0.1:5432/unused
        run: |
          pnpm --filter web generate:types
          pnpm prettier --write packages/db/src/payload-types.ts > /dev/null || true
          git diff --exit-code -- packages/db/src/payload-types.ts

  security:
    name: Dependency audit, secrets, SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
      - name: Semgrep SAST
        run: >-
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.187.0
          semgrep scan --config p/default --config p/typescript --config p/react --config p/nextjs
          --error --metrics off /src

  image:
    name: Docker image and Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [verify, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          load: true
          tags: ceylonvvip-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (vulnerabilities and secrets)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --no-progress ceylonvvip-web:ci
      - name: Trivy Dockerfile scan
        run: >-
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.2
          config --severity HIGH,CRITICAL --exit-code 1 /repo/docker
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "sha-${GITHUB_SHA::12}" main; do
            docker tag ceylonvvip-web:ci "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Ask Coolify to pull the new image
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -sS --fail-with-body --max-time 60 -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_STAGING_APP&force=false"
    env:
      COOLIFY_URL: https://cenocloud.cc
      COOLIFY_STAGING_APP: 1butpqa26ab144jja7vtblav
